<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubayet Tahsin</title>
    <style>
        /* Body style */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Profile image */
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-top: 20px;
        }

        /* Name */
        h1 {
            color: #0d6efd;
        }

        /* Social icons */
        .social-icons a {
            display: inline-block;
            margin: 0 10px;
            text-decoration: none;
            color: #fff;
            background-color: #0d6efd;
            padding: 10px 15px;
            border-radius: 50%;
            transition: 0.3s;
        }

        .social-icons a:hover {
            background-color: #0556c1;
        }

        /* Contact */
        .contact {
            margin-top: 20px;
        }

        .contact p {
            margin: 5px 0;
        }

        /* Student card */
        .student-card {
            margin-top: 30px;
        }

        .student-card img {
            width: 300px;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <!-- Profile -->
    <img src="profile.jpg" alt="Profile Picture" class="profile-pic">
    <h1>Rubayet Tahsin</h1>

    <!-- Social Media -->
    <div class="social-icons">
        <a href="https://www.facebook.com/RubayetTahsin" target="_blank">FB</a>
        <a href="https://www.instagram.com/rubayet.tahsin12" target="_blank">IG</a>
        <a href="https://www.tiktok.com/@rubayettahsin12" target="_blank">TT</a>
        <a href="https://www.youtube.com/@RubayetTahsin" target="_blank">YT</a>
    </div>

    <!-- Contact -->
    <div class="contact">
        <p>Email: rubayettahsin7@gmail.com</p>
        <p>WhatsApp: 01613859061</p>
    </div>

    <!-- Student Card -->
    <div class="student-card">
        <img src="student-card.jpg" alt="Student Card">
    </div>

    <p style="margin-top: 50px;">ওয়েবসাইটটি সংরক্ষিত</p>

</body>
</html>
