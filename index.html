  <style>
    /* Loader animation */
    #loader {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #1da1f2;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* General styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #0d1117;
      color: #fff;
    }

    header {
      text-align: center;
      padding: 50px 20px;
      background: #111827;
    }

    header img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #1da1f2;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      color: #1da1f2;
    }

    header p {
      font-size: 1.2rem;
      color: #ccc;
    }

    section {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #1da1f2;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    /* About section */
    #about p {
      font-size: 1.1rem;
      line-height: 1.6;
      text-align: center;
      color: #ccc;
    }

    /* Skills section */
    #skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .skill {
      background: #111827;
      padding: 15px 25px;
      border-radius: 10px;
      color: #1da1f2;
      font-weight: bold;
      transition: transform 0.3s;
    }

    .skill:hover {
      transform: scale(1.1);
      background: #1da1f2;
      color: #0d1117;
      cursor: pointer;
    }
